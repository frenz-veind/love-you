<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080008;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
  }

  /* START SCREEN */
  #startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: radial-gradient(ellipse at center, #1a0018 0%, #080008 70%);
    transition: opacity 0.8s ease;
  }
  #startScreen.hidden { opacity: 0; pointer-events: none; }

  .heart-deco {
    font-size: 48px;
    margin-bottom: 20px;
    animation: hb 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255,60,120,0.9));
  }
  @keyframes hb {
    0%,100%{transform:scale(1)} 14%{transform:scale(1.25)} 28%{transform:scale(1)} 42%{transform:scale(1.18)} 70%{transform:scale(1)}
  }

  .start-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(26px, 5vw, 48px);
    color: #ff4488;
    text-shadow: 0 0 30px rgba(255,68,136,0.7), 0 0 70px rgba(255,68,136,0.3);
    margin-bottom: 10px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  .start-sub {
    color: rgba(255,140,180,0.55);
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }

  .start-btn {
    position: relative;
    background: transparent;
    border: 2px solid rgba(255,68,136,0.55);
    color: #ff8ab8;
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 16px 50px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.4s;
    box-shadow: 0 0 28px rgba(255,68,136,0.18), inset 0 0 28px rgba(255,68,136,0.05);
  }
  .start-btn:hover {
    border-color: #ff4488;
    color: #fff;
    box-shadow: 0 0 45px rgba(255,68,136,0.55), inset 0 0 30px rgba(255,68,136,0.12);
    transform: scale(1.05);
  }
  .start-btn:active { transform: scale(0.97); }

  /* BG floating hearts */
  .floating-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .fheart {
    position: absolute; bottom: -30px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.25; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  /* CANVAS */
  #loveCanvas {
    position: fixed; inset: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #loveCanvas.visible { opacity: 1; }

  /* RESET BTN */
  #resetBtn {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,68,136,0.12);
    border: 1px solid rgba(255,68,136,0.3);
    color: rgba(255,150,180,0.8);
    padding: 10px 28px;
    border-radius: 30px;
    font-size: 13px;
    font-family: 'Quicksand', sans-serif;
    letter-spacing: 2px;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: all 0.4s;
    z-index: 20;
  }
  #resetBtn.visible { opacity: 1; pointer-events: all; }
  #resetBtn:hover { background: rgba(255,68,136,0.28); color: white; }
</style>
</head>
<body>

<div class="floating-hearts" id="floatingHearts"></div>

<div id="startScreen">
  <div class="heart-deco">❤️</div>
  <div class="start-title">For You</div>
  <div class="start-sub">sebuah perasaan</div>
  <button class="start-btn" onclick="startAnimation()">✦ Buka Pesan ✦</button>
</div>

<canvas id="loveCanvas"></canvas>
<button id="resetBtn" onclick="resetAll()">↩ Ulangi</button>

<script>
// ===== BG FLOATING HEARTS =====
(function(){
  const c = document.getElementById('floatingHearts');
  const emojis = ['❤️','💕','💗','💓','💞','✨','🌸'];
  for(let i=0;i<20;i++){
    const h = document.createElement('div');
    h.className='fheart';
    h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(10+Math.random()*16)+'px';
    h.style.animationDuration=(9+Math.random()*12)+'s';
    h.style.animationDelay=(Math.random()*10)+'s';
    c.appendChild(h);
  }
})();

// ===== CANVAS =====
const canvas = document.getElementById('loveCanvas');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== SAMPLE "LOVE YOU" TEXT INTO PIXEL POINTS =====
function getLovePoints() {
  const W = 600, H = 280;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const oc = off.getContext('2d');

  oc.fillStyle = '#000';
  oc.fillRect(0,0,W,H);
  oc.fillStyle = '#fff';
  oc.font = 'bold 128px serif';
  oc.textAlign = 'center';
  oc.textBaseline = 'middle';
  oc.fillText('LOVE', W/2, H*0.3);
  oc.fillText('YOU', W/2, H*0.75);

  const imgData = oc.getImageData(0,0,W,H).data;
  const pts = [];
  const step = 4;
  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      const idx=(y*W+x)*4;
      if(imgData[idx] > 128){
        pts.push({ nx: x/W, ny: y/H });
      }
    }
  }
  return pts;
}

// ===== PARTICLE =====
const WORDS = ['love','love you','i love you','❤','love'];

class Particle {
  constructor(tx, ty, word, delay, fontSize){
    this.tx = tx; this.ty = ty;
    this.word = word;
    this.delay = delay;
    this.fontSize = fontSize;

    // spawn from random scatter
    const angle = Math.random()*Math.PI*2;
    const r = Math.max(canvas.width, canvas.height) * (0.5 + Math.random()*0.5);
    this.x = canvas.width/2  + Math.cos(angle)*r;
    this.y = canvas.height/2 + Math.sin(angle)*r;

    this.alpha = 0;
    this.born = false;
    this.arrived = false;
    this.startTime = null;

    // warm red/pink palette
    const hue = 340 + Math.random()*30 - 15;
    const sat = 70 + Math.random()*30;
    const lit = 55 + Math.random()*30;
    this.color = `hsl(${hue},${sat}%,${lit}%)`;
    this.glow  = Math.random() > 0.65;
  }

  update(now){
    if(this.startTime===null) this.startTime=now;
    const elapsed = now - this.startTime - this.delay;
    if(elapsed < 0) return;
    if(!this.born) this.born=true;

    const t = Math.min(elapsed/2000, 1); // 2s travel
    const ease = 1 - Math.pow(1-t, 4);

    this.x += (this.tx - this.x) * ease * 0.055;
    this.y += (this.ty - this.y) * ease * 0.055;
    this.alpha = Math.min(t*2.2, 0.9);

    if(Math.abs(this.x-this.tx)<1.5 && Math.abs(this.y-this.ty)<1.5) this.arrived=true;
  }

  draw(){
    if(!this.born || this.alpha<=0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    if(this.glow){
      ctx.shadowColor='#ff3366';
      ctx.shadowBlur=10;
    }
    ctx.font = `${this.fontSize}px 'Quicksand',sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(this.word, this.x, this.y);
    ctx.restore();
  }
}

// ===== STATE =====
let particles=[], animating=false, animFrame=null;
let globalStart=null, resetShown=false, beatDone=false;

function buildParticles(){
  const pts = getLovePoints();

  const cw = canvas.width, ch = canvas.height;
  // Scale "LOVE" to fill screen nicely
  // pts normalized 0-1 for 500x160 canvas
  const textW = cw * 0.88;
  const textH = textW * (280/600);
  const offX = (cw - textW) / 2;
  const offY = (ch - textH) / 2;

  particles = pts.map((p,i)=>{
    const tx = offX + p.nx * textW;
    const ty = offY + p.ny * textH;
    const word = WORDS[Math.floor(Math.random()*WORDS.length)];
    const delay = i * 6 + Math.random()*600;
    const fontSize = 6 + Math.random()*6;
    return new Particle(tx, ty, word, delay, fontSize);
  });
}

function loop(now){
  if(!globalStart) globalStart=now;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // radial bg glow
  const cx=canvas.width/2, cy=canvas.height/2;
  const pulse = 0.25 + 0.1*Math.sin(now*0.0018);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(cx,cy)*1.1);
  g.addColorStop(0,`rgba(100,0,30,${pulse})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let allArrived=true;
  particles.forEach(p=>{
    p.update(now);
    p.draw();
    if(!p.arrived) allArrived=false;
  });

  if(allArrived && !beatDone){
    beatDone=true;
    startHeartbeat();
  }

  if(!resetShown && now-globalStart > 3000){
    resetShown=true;
    document.getElementById('resetBtn').classList.add('visible');
  }

  animFrame=requestAnimationFrame(loop);
}

function startHeartbeat(){
  let t=0;
  const fn=()=>{
    t++;
    const s=1+0.025*Math.sin(t*0.07);
    canvas.style.transform=`scale(${s})`;
    requestAnimationFrame(fn);
  };
  fn();
}

// ===== START =====
function startAnimation(){
  document.getElementById('startScreen').classList.add('hidden');
  setTimeout(()=>{
    canvas.classList.add('visible');
    buildParticles();
    animating=true;
    requestAnimationFrame(loop);
  }, 600);
}

// ===== RESET =====
function resetAll(){
  cancelAnimationFrame(animFrame);
  animFrame=null; globalStart=null; resetShown=false; beatDone=false;
  particles=[]; animating=false;
  canvas.style.transform='';
  canvas.classList.remove('visible');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('resetBtn').classList.remove('visible');

  const sc=document.getElementById('startScreen');
  sc.style.opacity='0'; sc.style.display='flex';
  sc.classList.remove('hidden');
  setTimeout(()=>{ sc.style.transition='opacity 0.5s'; sc.style.opacity='1'; },50);
}

window.addEventListener('resize',()=>{
  resize();
  if(animating){
    cancelAnimationFrame(animFrame);
    globalStart=null; resetShown=false; beatDone=false;
    canvas.style.transform='';
    buildParticles();
    requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
