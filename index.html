<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 20px;
            color: #fff;
            background: transparent;
            border: 2px solid #ff4d79;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px #ff4d79, inset 0 0 10px #ff4d79;
        }

        #start-btn:hover {
            background: #ff4d79;
            box-shadow: 0 0 30px #ff4d79, inset 0 0 20px #ff4d79;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Biar tombol bisa diklik */
        }
    </style>
</head>
<body>

    <button id="start-btn" onclick="startLove()">Klik Aku ❤️</button>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('start-btn');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let isAnimating = false;

        // Fungsi untuk membuat koordinat bentuk hati
        function heartShape(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x, y: -y }; // y di-inverse karena koordinat canvas terbalik
        }

        class Particle {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = Math.random() * 3 + 1;
                // Warna pink-merah bervariasi
                this.color = `hsl(${340 + Math.random() * 30}, 100%, 60%)`;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.friction = 0.95;
            }

            update() {
                // Tarik partikel ke posisi target (bentuk hati/tulisan)
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                
                this.vx += dx * 0.02;
                this.vy += dy * 0.02;
                
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function createHeartParticles() {
            particles = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Ukuran hati disesuaikan dengan layar
            const scale = Math.min(canvas.width, canvas.height) / 40; 

            for (let i = 0; i < Math.PI * 2; i += 0.02) {
                const pos = heartShape(i);
                // Posisi awal acak
                const startX = Math.random() * canvas.width;
                const startY = Math.random() * canvas.height;
                
                // Posisi target (bentuk hati)
                const targetX = centerX + pos.x * scale;
                const targetY = centerY + pos.y * scale;

                particles.push(new Particle(startX, startY, targetX, targetY));
            }
        }

        // Teks "I LOVE YOU"
        function createTextParticles() {
            particles = [];
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10vw Arial'; // Ukuran relatif layar
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Gambar teks tersembunyi untuk mengambil pikselnya
            ctx.fillText('I LOVE YOU', canvas.width / 2, canvas.height / 2);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Hapus teks asli

            for (let y = 0; y < canvas.height; y += 6) { // step = kerapatan partikel
                for (let x = 0; x < canvas.width; x += 6) {
                    const index = (y * canvas.width + x) * 4;
                    if (data[index + 3] > 128) { // Jika pixel tidak transparan
                        const startX = Math.random() * canvas.width;
                        const startY = Math.random() * canvas.height;
                        particles.push(new Particle(startX, startY, x, y));
                    }
                }
            }
        }

        function animate() {
            if (!isAnimating) return;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Efek trail
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        function startLove() {
            btn.style.display = 'none'; // Sembunyikan tombol
            isAnimating = true;
            
            // Fase 1: Bentuk Hati
            createHeartParticles();
            animate();

            // Fase 2: Berubah jadi "I LOVE YOU" setelah 4 detik
            setTimeout(() => {
                createTextParticles();
            }, 4000);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (isAnimating) {
                // Restart animasi jika di-resize agar posisi pas di tengah
                startLove();
            }
        });
    </script>
</body>
</html>
